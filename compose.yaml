services:
  s5-dmr-monitor:
    build: .
    image: s5-dmr-monitor:1.0
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8088}:8000"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    pids_limit: 100
